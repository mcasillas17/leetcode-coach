# Copy this into this trusted project's .codex/config.toml (merge if it exists).
# No cookie is required for public problem lookup.
[mcp_servers.leetcode]
command = "npx"
args = ["-y", "@jinzcdev/leetcode-mcp-server@1.4.0", "--site", "global"]
env_vars = ["LEETCODE_SESSION"]
startup_timeout_sec = 30
tool_timeout_sec = 45
disabled_tools = ["list_problem_solutions", "get_problem_solution"]
