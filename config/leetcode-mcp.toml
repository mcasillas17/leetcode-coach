# Replace both /ABSOLUTE/PATH/leetcode-coach paths, then merge into .codex/config.toml.
# Local stdio only. No cookie, npx, downloaded server, or shell wrapper.
[mcp_servers.leetcode]
command = "/ABSOLUTE/PATH/leetcode-coach/.venv/bin/python"
args = ["/ABSOLUTE/PATH/leetcode-coach/scripts/serve_mcp.py"]
startup_timeout_sec = 15
tool_timeout_sec = 30
